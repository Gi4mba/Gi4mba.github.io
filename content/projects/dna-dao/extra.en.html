<div class="sim" id="sim" data-ui data-total="1000" data-status="approved">
  <h4 class="sim-title">Try the voting rule</h4>
  <p class="sim-note">A DAO with 1,000 shares. Move the votes: the outcome runs the same integer checks as <code>status()</code> in the contract.</p>
  <div class="sim-grid">
    <div class="sim-controls">
      <div class="sim-field" data-kind="for">
        <label for="sim-for">For</label>
        <output id="sim-for-out" for="sim-for">300</output>
        <input id="sim-for" type="range" min="0" max="1000" step="1" value="300">
      </div>
      <div class="sim-field" data-kind="against">
        <label for="sim-against">Against</label>
        <output id="sim-against-out" for="sim-against">180</output>
        <input id="sim-against" type="range" min="0" max="1000" step="1" value="180">
      </div>
      <div class="sim-field" data-kind="abstain">
        <label for="sim-abstain">Abstain</label>
        <output id="sim-abstain-out" for="sim-abstain">60</output>
        <input id="sim-abstain" type="range" min="0" max="1000" step="1" value="60">
      </div>
      <div class="sim-presets" role="group" aria-label="Edge cases from the test suite">
        <button type="button" data-preset="400,0,0">Exactly 40%</button>
        <button type="button" data-preset="390,0,0">39% turnout</button>
        <button type="button" data-preset="250,250,0">Tie</button>
        <button type="button" data-preset="251,250,0">Won by one share</button>
        <button type="button" data-preset="0,0,500">All abstain</button>
      </div>
    </div>
    <div class="sim-outcome">
      <p class="sim-status" data-status="approved" aria-live="polite">Approved</p>
      <div class="sim-bar" aria-hidden="true">
        <span class="sim-seg sim-seg-for"></span><span class="sim-seg sim-seg-against"></span><span class="sim-seg sim-seg-abstain"></span>
        <span class="sim-quorum"></span>
      </div>
      <ul class="sim-checks">
        <li class="sim-check" data-ok="true">Quorum reached: 54% of shares voted, 40% needed</li>
        <li class="sim-check" data-ok="true">More For than Against: 300 to 180</li>
      </ul>
      <p class="sim-rest">460 shares did not vote</p>
    </div>
  </div>
</div>
